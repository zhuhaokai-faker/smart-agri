# =============================================================================
#  智慧农业分析平台 —— 容器内的 nginx（Linux）
# =============================================================================
#  这份是 deploy/nginx.conf 的容器版。和那份只有两处不同：
#
#    ① upstream 只有一个端口
#       gunicorn 自己管多进程，不需要 nginx 做分发。Windows 版有 4 个 waitress
#       端口，是因为 Windows 上没有 gunicorn（依赖 os.fork），只能自己编排 ——
#       那个脚本存在的全部理由，在容器里都不存在。
#
#    ② 路径是绝对的
#       容器里 prefix 是 /etc/nginx，deploy/nginx.conf 里那些相对 prefix 的
#       `root ../../app` 到这里全都不成立。这不是风格问题，写错了静态文件
#       会 404，而 404 不会告诉你是路径基准搞错了。
#
#  其余部分（静态缓存策略、每个 proxy_set_header 的选择）和 Windows 版保持
#  一致 —— 理由在那份文件里写得很细，这里只留结论不重复论述。
# =============================================================================

upstream agri_backend {
    # 只监听回环：gunicorn 绑在 127.0.0.1:8000，容器外连不进来。
    # 这是"nginx 是唯一可信入口"这个前提的物理保证 —— 见下面 X-Forwarded-For 那段。
    server 127.0.0.1:8000;
    keepalive 32;
}

server {
    listen      80;
    server_name _;

    # 表单里最长的字段是备注，4MB 给足余量。nginx 默认 1MB，
    # 超了直接 413，而且发生在到达 Flask 之前，应用层的统一错误处理接不到。
    client_max_body_size 4m;

    # ---------------------------------------------------------------- 静态文件
    # root 指向 /app/app：仓库根是 /app，Flask 的 static 目录是 /app/app/static，
    # 拼上 URI 的 /static/... 正好落对。
    #
    # 分两段给缓存时间，理由同 deploy/nginx.conf：vendor/ 下是 bootstrap、
    # echarts 这些第三方库，除非升级否则字节不变，给 30 天；app.css / app.js
    # 是自己写的，改一行就得让用户拿到新的，1 小时已经是敢给的上限。
    location /static/vendor/ {
        root        /app/app;
        access_log  off;
        expires     30d;
        add_header  Cache-Control "public, immutable";
    }

    location /static/ {
        root        /app/app;
        access_log  off;
        expires     1h;
        add_header  Cache-Control "public";
    }

    # ---------------------------------------------------------------- 动态请求
    location / {
        proxy_pass         http://agri_backend;
        proxy_http_version 1.1;
        proxy_set_header   Connection "";       # 配合 upstream keepalive

        # ⚠️ 必须用 $http_host 而不是 $host：$host 是规范化后的主机名、**不含端口**，
        #    而 Flask 生成重定向用的是 request.host。用 $host 会让
        #    http://127.0.0.1:8080/weather/ 变成 http://127.0.0.1/weather/ ——
        #    少了端口，客户端去连 80 被拒。表现为"部分链接打不开"，
        #    排查起来毫无头绪。完整复现见 deploy/nginx.conf。
        proxy_set_header   Host              $http_host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-Host  $http_host;

        # ⚠️ 用 $remote_addr **覆盖**，而不是 $proxy_add_x_forwarded_for 追加。
        #    audit_service.client_ip() 取 X-Forwarded-For 的**第一个**值；用追加
        #    的话客户端自己发的头会排在最前面，等于**任何人都能往审计日志里写
        #    任意来源 IP**。而来源 IP 恰恰是审计日志最不能被记录者自己伪造的一项。
        #    完整推理见 deploy/nginx.conf。
        proxy_set_header   X-Forwarded-For   $remote_addr;
        proxy_set_header   X-Forwarded-Proto $scheme;

        proxy_connect_timeout 5s;
        proxy_read_timeout    60s;
    }
}

# 顺带记一笔：这里不需要 Windows 那边 waitress 的 trusted_proxy 绕法。
# waitress 默认 clear_untrusted_proxy_headers=True，会把 nginx 传来的
# X-Forwarded-For 直接删掉（deploy/waitress_worker.py 存在的唯一理由）；
# gunicorn 没有这个行为，头部原样透传。
