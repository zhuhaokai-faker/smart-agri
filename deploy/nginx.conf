# =============================================================================
#  智慧农业种植管理与产量分析平台 —— nginx 前端
# =============================================================================
#  职责有两个，缺一不可：
#
#  ① 把请求分发给 N 个 waitress 工作进程（upstream 那一节）
#     —— 这是多进程方案能成立的前提。GIL 决定了单进程只能用满一个核，
#        实测 1 进程 176 RPS、4 进程 425 RPS（scripts/loadtest.py）。
#        但没有前端做分发，多起来的进程没有请求可接。
#
#  ② 静态文件直接读磁盘返回，不经过 Python
#     —— 实测静态文件跑 Flask 是 1126 RPS，本身不是瓶颈，
#        这部分省下的是 Python 侧的 CPU（GIL 时间），不是响应时间。
#
#  ---------------------------------------------------------------------------
#  ⚠️ 这份配置被 serve_cluster.py **复制**到 tools/nginx/conf/nginx.conf 后使用，
#     不是原地加载的。原因是 nginx 解析相对路径有两套基准，实测确认：
#       · `include mime.types`    → 相对**配置文件所在目录**
#       · `root` / `logs/` / 临时目录 → 相对 **prefix**（启动时的 -p）
#     而 mime.types 在 tools/nginx/conf/ 里。配置若留在 deploy/ 目录下加载，
#     `include mime.types` 会在 deploy/ 里找，直接启动失败。
#     所以下面这些路径是按"配置文件位于 tools/nginx/conf/、prefix = tools/nginx"
#     写的。手工改完这份文件后要重新复制过去才生效。
#
#     容器里（Linux + gunicorn）这份不能直接照搬：upstream 只有一个 gunicorn，
#     路径也换成容器内的绝对路径。见 README 的部署一节。
# =============================================================================

worker_processes  2;

error_log  logs/error.log  warn;
pid        logs/nginx.pid;

events {
    worker_connections  1024;
}

http {
    include       mime.types;
    default_type  application/octet-stream;

    sendfile           on;
    tcp_nopush         on;
    keepalive_timeout  65;
    server_tokens      off;      # 不对外暴露 nginx 版本号

    access_log  logs/access.log;

    # 文本类资源压缩传输。图片/字体已经是压缩格式，再 gzip 纯属浪费 CPU。
    gzip              on;
    gzip_min_length   1024;
    gzip_types        text/plain text/css application/javascript
                      application/json image/svg+xml;

    # ---------------------------------------------------------------- 后端池
    # 端口要和 serve_cluster.py 里的 --base-port / --workers 对得上。
    # 默认：workers=4 → 8001..8004。改了 worker 数量，这里也要改。
    #
    # keepalive 让 nginx 和后端之间复用 TCP 连接。没有它的话每个请求都要
    # 重新三次握手 —— 在一个全是几十毫秒小请求的页面上，这笔开销占比不小。
    # 必须配合下面 proxy_http_version 1.1 和清空 Connection 头才生效。
    upstream agri_backend {
        server 127.0.0.1:8001;
        server 127.0.0.1:8002;
        server 127.0.0.1:8003;
        server 127.0.0.1:8004;
        keepalive 32;
    }

    server {
        listen       8080;
        server_name  _;

        # ------------------------------------------- 隧道进来时的真实客户端 IP
        # ⚠️ 这段是给"nginx 前面还挂了一层"准备的 —— 也就是
        #    start_public.bat（serve_cluster.py --tunnel）那条路。
        #
        #    【不打开会怎样】
        #      隧道在前面又套了一层，nginx 看到的 TCP 对端变成 cloudflared
        #      自己（127.0.0.1），于是下面 proxy_set_header X-Forwarded-For
        #      $remote_addr 传下去的就是 127.0.0.1 —— 审计日志里所有操作
        #      的来源 IP 集体退化成 127.0.0.1，"谁从哪改的数据"这条证据链
        #      当场失效，而且不报任何错。
        #
        #    【打开之后】
        #      下面那行不用改：realip 模块会把 $remote_addr 本身换掉，
        #      换成 CF-Connecting-IP 里的值，取到的就是真实客户端 IP。
        #
        #    【为什么是 CF-Connecting-IP，不是 X-Forwarded-For】
        #      XFF 是一条**链**，取哪一跳要靠 real_ip_recursive 去猜；
        #      而且客户端一开始就能自己往链里塞值。CF-Connecting-IP 是
        #      Cloudflare 边缘写入的**单值**头，客户端自己发的会被边缘覆盖。
        #      对一个要求"来源 IP 不能被记录者自己伪造"的审计日志来说，
        #      单值头才是对的 —— 这也是本项目一贯的取舍，见下面 XFF 那段。
        #
        #    【只信任 127.0.0.1 是安全的】
        #      cloudflared 就在本机，它的连接必然来自回环；外网客户端
        #      连不到 127.0.0.1，也就没法伪造这个头。
        #
        #    【不带隧道时没有副作用】
        #      直接访问 :8080 的请求根本没有 CF-Connecting-IP 这个头，
        #      $remote_addr 保持原样，和改动前完全一致。唯一放宽的是：
        #      本机进程直接压 :8080 时可以自称任意 IP —— 但本机进程本来
        #      就能直接改数据库，这不在威胁模型里。
        set_real_ip_from  127.0.0.1;
        real_ip_header    CF-Connecting-IP;

        # 表单里最长的字段是备注，4MB 给足余量。
        # nginx 默认 1MB，超了直接 413 —— 而且报错发生在到达 Flask 之前，
        # 应用层的统一错误处理接不到，用户看到的是一张 nginx 的英文错误页。
        client_max_body_size 4m;

        # ------------------------------------------------------ 静态文件
        # `root ../../app` 是相对 prefix（tools/nginx）解析的，
        # 拼上 URI 的 /static/... 正好落到 <仓库根>/app/static/...
        #
        # 分两段给缓存时间，是因为这两类文件的变更频率差了几个数量级：
        #   vendor/ 下是 bootstrap、echarts、highlight 这些第三方库，
        #   除非升级版本否则字节不变 —— 缓存一个月，让重复访问零请求。
        #   而 app.css / app.js 是自己写的，改一行就得让用户拿到新的，
        #   缓存一小时已经是敢给的上限（改完 Ctrl+F5 强制刷新即可）。
        # 一刀切成 7 天的话，改样式后自己都会被缓存坑到。
        location /static/vendor/ {
            root        ../../app;
            access_log  off;
            expires     30d;
            add_header  Cache-Control "public, immutable";
        }

        location /static/ {
            root        ../../app;
            access_log  off;
            expires     1h;
            add_header  Cache-Control "public";
        }

        # ------------------------------------------------------ 动态请求
        location / {
            proxy_pass         http://agri_backend;
            proxy_http_version 1.1;
            proxy_set_header   Connection "";       # 配合 upstream keepalive，见上

            # ⚠️ 必须用 $http_host 而不是 $host —— 差一个端口，后果很隐蔽。
            #    $host 是**规范化后的主机名，不含端口**；$http_host 是客户端
            #    发来的原始 Host 头（含端口）。Flask/Werkzeug 生成重定向时
            #    用的是 request.host，于是：
            #      $host       → 308 Location: http://127.0.0.1/weather/   ← 掉了 :8080
            #      $http_host  → 308 Location: http://127.0.0.1:8080/weather/
            #    少了端口，客户端会去连 80 端口并被拒绝。在浏览器里表现为
            #    "部分链接打不开"、且只在带 URL 前缀的页面出现（/weather 这种
            #    需要补斜杠的路由），排查起来毫无头绪。
            #    这个 bug 就是压测时被 /weather 的 356 个连接拒绝暴露出来的。
            proxy_set_header   Host              $http_host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-Host  $http_host;

            # ⚠️ 这里刻意用 $remote_addr **覆盖**，而不是用
            #    $proxy_add_x_forwarded_for **追加** —— 这是一个安全取舍。
            #
            #    audit_service.client_ip() 取的是 X-Forwarded-For 的**第一个**值。
            #    如果这里用 $proxy_add_x_forwarded_for（业界常见写法），
            #    客户端自己发来的头会被保留在最前面：
            #        客户端发 "X-Forwarded-For: 9.9.9.9"
            #        nginx 拼成 "9.9.9.9, 127.0.0.1"
            #        应用取第一个 → 记成 9.9.9.9
            #    也就是说**任何人都能往审计日志里写任意来源 IP**。
            #    对这个项目来说这尤其致命：审计日志的卖点是"谁在什么时候
            #    从哪改了数据"，而来源 IP 恰恰是可以被记录者自己伪造的那一项。
            #
            #    在走 nginx 之前，request.remote_addr 取自 TCP 连接，
            #    客户端无法伪造。是"加一层反代"这个动作本身把这个性质弄丢的 ——
            #    所以必须在这里补回来，否则就是把安全性做退化了。
            #
            #    用 $remote_addr 覆盖后，含义等同于"nginx 是唯一可信入口"。
            #    ⚠️ 在 nginx **前面**再加一层时（cloudflared 隧道就是这样，
            #       见本 server 块开头的 realip 那段），$remote_addr 会变成
            #       那一层的地址。那里已经用 realip 模块把它换回真实客户端 IP，
            #       所以这一行不用改 —— 它拿到的始终是"可信入口测出来的来源"。
            proxy_set_header   X-Forwarded-For   $remote_addr;
            proxy_set_header   X-Forwarded-Proto $scheme;

            proxy_connect_timeout 5s;
            proxy_read_timeout    60s;
        }
    }
}
