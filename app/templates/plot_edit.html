{% extends 'base.html' %}
{% block page_title %}编辑地块 · {{ plot.plot_no }}{% endblock %}
{% block content %}
<div class="row"><div class="col-lg-7">
  <div class="card">
    <div class="card-header">编辑地块信息
      <span class="sub">修改会记入操作审计日志（含变更前后快照）</span></div>
    <div class="card-body">
      <form method="post">
        {# CSRF：POST 表单必须带，否则被 400 拒绝 #}
        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
        <div class="row g-3">
          <div class="col-md-6">
            <label class="form-label">地块名称</label>
            <input type="text" name="name" class="form-control" value="{{ plot.name }}" required>
          </div>
          <div class="col-md-6">
            <label class="form-label">面积（亩）</label>
            <input type="number" step="0.01" name="area_mu" class="form-control"
                   value="{{ plot.area_mu }}" required>
          </div>
          <div class="col-md-4">
            <label class="form-label">土壤类型</label>
            <select name="soil_type" class="form-select">
              {% for k, v in [(1,'壤土'),(2,'黏土'),(3,'砂土'),(4,'砂壤土')] %}
              <option value="{{ k }}" {{ 'selected' if plot.soil_type == k }}>{{ v }}</option>
              {% endfor %}
            </select>
          </div>
          <div class="col-md-4">
            <label class="form-label">灌溉方式</label>
            <select name="irrigation_type" class="form-select">
              {% for k, v in [(1,'雨养'),(2,'漫灌'),(3,'喷灌'),(4,'滴灌')] %}
              <option value="{{ k }}" {{ 'selected' if plot.irrigation_type == k }}>{{ v }}</option>
              {% endfor %}
            </select>
          </div>
          <div class="col-md-4">
            <label class="form-label">地力等级</label>
            <select name="fertility_level" class="form-select">
              {% for k, v in [(1,'优'),(2,'中'),(3,'差')] %}
              <option value="{{ k }}" {{ 'selected' if plot.fertility_level == k }}>{{ v }}</option>
              {% endfor %}
            </select>
            <div class="form-text">影响产量分层分析</div>
          </div>
          <div class="col-md-6">
            <label class="form-label">状态</label>
            <select name="status" class="form-select">
              <option value="1" {{ 'selected' if plot.status == 1 }}>在耕</option>
              <option value="0" {{ 'selected' if plot.status == 0 }}>闲置</option>
            </select>
          </div>
          <div class="col-12">
            <label class="form-label">备注</label>
            <textarea name="remark" class="form-control" rows="2">{{ plot.remark }}</textarea>
          </div>
        </div>
        <div class="mt-3">
          <button class="btn btn-success">保存</button>
          <a href="{{ url_for('base_data.plot_detail', plot_id=plot.id) }}"
             class="btn btn-outline-secondary">取消</a>
        </div>
      </form>
    </div>
  </div>
</div></div>
{% endblock %}
